{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YDM — Forgot password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/output.css' %}"/>
  <style>
    :root{--bg:#0d0d0d;--bg-card:#161616;--bg-raised:#1e1e1e;--border:#2a2a2a;--border-hi:#3a3a3a;--red:#e5190e;--red-dim:rgba(229,25,14,.1);--text:#f0f0f0;--text-2:#8a8a8a;--text-3:#444;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{-webkit-font-smoothing:antialiased;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:grid;place-items:center;padding:24px;}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(229,25,14,.06),transparent 70%);pointer-events:none;}
    a{color:inherit;text-decoration:none;}

    .auth-card{width:100%;max-width:400px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative;z-index:1;}
    .auth-card-header{padding:32px 32px 0;}
    .logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:28px;}
    .logo .icon{width:22px;height:22px;background:var(--red);clip-path:polygon(15% 0%,100% 50%,15% 100%);}
    .auth-title{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px;}
    .auth-sub{font-size:13px;color:var(--text-2);}
    .auth-card-body{padding:24px 32px 28px;}

    .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
    label{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;}
    .input{width:100%;padding:11px 14px;border-radius:8px;background:var(--bg-raised);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;}
    .input::placeholder{color:var(--text-3);}
    .input:focus{border-color:rgba(229,25,14,.5);box-shadow:0 0 0 3px var(--red-dim);}

    .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:8px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
    .btn-primary{background:var(--red);color:#fff;}
    .btn-primary:hover{background:#c9140a;}
    .btn-primary:active{transform:scale(.98);}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;}

    .auth-footer{padding:0 32px 28px;text-align:center;font-size:13px;color:var(--text-2);}
    .auth-link{color:var(--red);font-weight:600;}
    .auth-link:hover{text-decoration:underline;}

    .alert{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;display:none;margin-bottom:16px;align-items:flex-start;gap:10px;}
    .alert.show{display:flex;}
    .alert-error{background:rgba(229,25,14,.1);border:1px solid rgba(229,25,14,.25);color:#f87171;}
    .alert-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:#4ade80;}
    .alert .material-symbols-outlined{font-size:18px;flex-shrink:0;margin-top:1px;}

    .version{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.08em;}
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-card-header">
    <div class="logo"><div class="icon"></div>YDM</div>
    <h1 class="auth-title">Reset password.</h1>
    <p class="auth-sub">We'll send a link to your inbox.</p>
  </div>
  <div class="auth-card-body">
    <div class="alert alert-success" id="success-msg">
      <span class="material-symbols-outlined">check_circle</span>
      <div>
        <p style="font-weight:700;">Email sent!</p>
        <p style="font-size:12px;opacity:.8;">Check your inbox for the reset link.</p>
      </div>
    </div>
    <div class="alert alert-error" id="error-msg">
      <span class="material-symbols-outlined">error</span>
      <span id="error-text"></span>
    </div>

    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" class="input" placeholder="you@example.com" autocomplete="email" required/>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">
        <span id="btn-text">Send reset link</span>
        <span class="material-symbols-outlined" id="btn-icon" style="font-size:18px;">mail</span>
      </button>
    </form>
  </div>
  <div class="auth-footer">
    Remember it now? <a href="{% url 'login' %}" class="auth-link">Sign in</a>
  </div>
</div>

<div class="version">System v.2.4 // Build 9021</div>

<script>
  document.getElementById('forgot-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    const successEl = document.getElementById('success-msg');
    const errorEl = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');

    successEl.classList.remove('show');
    errorEl.classList.remove('show');
    btn.disabled = true;
    btnText.textContent = 'Sending…';
    btnIcon.textContent = 'hourglass_empty';

    try {
      const r = await fetch('/api/accounts/forgot-password/', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email})
      });
      const d = await r.json();
      if (r.ok) {
        successEl.classList.add('show');
        document.getElementById('email').value = '';
        btnText.textContent = 'Email sent';
        btnIcon.textContent = 'check';
      } else {
        errorText.textContent = d.error || d.errors?.email?.[0] || 'Failed to send reset email';
        errorEl.classList.add('show');
        btnText.textContent = 'Send reset link';
        btnIcon.textContent = 'mail';
        btn.disabled = false;
      }
    } catch {
      errorText.textContent = 'Network error. Please try again.';
      errorEl.classList.add('show');
      btnText.textContent = 'Send reset link';
      btnIcon.textContent = 'mail';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
