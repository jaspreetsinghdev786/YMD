{% load static %}
<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>YMD - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center p-4 overflow-y-auto relative selection:bg-primary selection:text-white">
    <!-- Abstract Grid Background -->
    <div class="fixed inset-0 z-0 pointer-events-none opacity-[0.03] dark:opacity-[0.05]"
        style="background-image: linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px); background-size: 40px 40px;">
    </div>
    <!-- Main Container -->
    <main
        class="relative z-10 w-full max-w-[400px] bg-white dark:bg-[#111] border border-black dark:border-white p-10 flex flex-col gap-8 shadow-none group/card">
        <!-- Header / Logo -->
        <header class="flex flex-col items-center gap-2 pb-2">
            <div class="relative">
                <h1 class="text-7xl font-black tracking-[-0.05em] text-black dark:text-white leading-none select-none">
                    YMD</h1>
                <!-- Accent Dot -->
                <div class="absolute -right-3 top-2 w-2 h-2 bg-primary rounded-none"></div>
            </div>
            <p class="text-sm font-bold tracking-[0.3em] text-black dark:text-white uppercase opacity-60">Password Reset
            </p>
        </header>

        <!-- Initial State: Email Form -->
        <div id="email-form-container">
            <p class="text-sm text-center text-black dark:text-white opacity-70 mb-6">
                Enter your email address and we'll send you a link to reset your password.
            </p>

            <!-- Success Message -->
            <div id="success-message"
                class="hidden mb-6 p-4 border-2 border-green-500 bg-green-50 dark:bg-green-900/20">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-green-500 text-2xl">check_circle</span>
                    <div>
                        <p class="font-bold text-sm text-green-700 dark:text-green-400">Email Sent!</p>
                        <p class="text-xs text-green-600 dark:text-green-500">Check your inbox for the reset link.</p>
                    </div>
                </div>
            </div>

            <!-- Error Message -->
            <div id="error-message" class="hidden mb-6 p-4 border-2 border-red-500 bg-red-50 dark:bg-red-900/20">
                <p class="font-bold text-sm text-red-700 dark:text-red-400" id="error-text">Error message</p>
            </div>

            <form id="forgot-password-form" class="flex flex-col gap-6 w-full">
                <!-- Email Input -->
                <div class="flex flex-col gap-1.5 group/input">
                    <label
                        class="text-xs font-bold uppercase tracking-widest text-black dark:text-white group-focus-within/input:text-primary transition-colors"
                        for="email">Email Address</label>
                    <input
                        class="w-full h-14 bg-transparent border-2 border-black dark:border-white text-black dark:text-white px-4 text-base font-medium placeholder:text-gray-400 placeholder:uppercase placeholder:text-sm focus:ring-0 focus:border-[3px] focus:border-black dark:focus:border-white focus:outline-none transition-all rounded-none"
                        id="email" name="email" placeholder="user@example.com" type="email" required />
                </div>
                <!-- Primary Action -->
                <button type="submit" id="submit-btn"
                    class="relative w-full h-14 bg-black dark:bg-white text-white dark:text-black font-bold text-base uppercase tracking-[0.05em] border-2 border-black dark:border-white hover:bg-primary hover:border-primary hover:text-white dark:hover:bg-primary dark:hover:border-primary dark:hover:text-white transition-all duration-200 flex items-center justify-center gap-3 overflow-hidden group/btn disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="relative z-10" id="btn-text">Send Reset Link</span>
                    <span
                        class="material-symbols-outlined text-lg relative z-10 transition-transform group-hover/btn:translate-x-1"
                        id="btn-icon">mail</span>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <footer class="text-center pt-2">
            <p class="text-sm font-medium text-black dark:text-white">
                REMEMBER PASSWORD?
                <a class="inline-block ml-1 font-bold underline decoration-2 decoration-primary underline-offset-4 hover:bg-primary hover:text-white hover:no-underline px-1 transition-all uppercase"
                    href="{% url 'login' %}">Sign In</a>
            </p>
        </footer>
        <!-- Decorative Corner Elements for Brutalist feel -->
        <div class="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-primary dark:border-primary"></div>
        <div class="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-primary dark:border-primary"></div>
    </main>
    <!-- Version Tag -->
    <div class="fixed bottom-6 font-mono text-[10px] text-black/40 dark:text-white/40 tracking-widest uppercase">
        System v.2.4 // Build 9021
    </div>

    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const successEl = document.getElementById('success-message');
            const errorEl = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            // Hide previous messages
            successEl.classList.add('hidden');
            errorEl.classList.add('hidden');

            // Disable button and show loading
            submitBtn.disabled = true;
            btnText.textContent = 'Sending...';
            btnIcon.textContent = 'hourglass_empty';

            try {
                const response = await fetch('/api/accounts/forgot-password/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    successEl.classList.remove('hidden');
                    // Reset form
                    document.getElementById('email').value = '';
                    btnText.textContent = 'Email Sent';
                    btnIcon.textContent = 'check';
                } else {
                    errorText.textContent = data.error || data.errors?.email?.[0] || 'Failed to send reset email';
                    errorEl.classList.remove('hidden');
                    // Reset button
                    btnText.textContent = 'Send Reset Link';
                    btnIcon.textContent = 'mail';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                errorText.textContent = 'Network error. Please try again.';
                errorEl.classList.remove('hidden');
                // Reset button
                btnText.textContent = 'Send Reset Link';
                btnIcon.textContent = 'mail';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
