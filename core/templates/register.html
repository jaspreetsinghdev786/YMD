{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YDM — Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/output.css' %}"/>
  <style>
    :root{--bg:#0d0d0d;--bg-card:#161616;--bg-raised:#1e1e1e;--border:#2a2a2a;--border-hi:#3a3a3a;--red:#e5190e;--red-dim:rgba(229,25,14,.1);--text:#f0f0f0;--text-2:#8a8a8a;--text-3:#444;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{-webkit-font-smoothing:antialiased;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:grid;place-items:center;padding:24px;}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(229,25,14,.06),transparent 70%);pointer-events:none;}
    a{color:inherit;text-decoration:none;}

    .auth-card{width:100%;max-width:400px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative;z-index:1;}
    .auth-card-header{padding:32px 32px 0;}
    .logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:28px;}
    .logo .icon{width:22px;height:22px;background:var(--red);clip-path:polygon(15% 0%,100% 50%,15% 100%);}
    .auth-title{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px;}
    .auth-sub{font-size:13px;color:var(--text-2);}
    .auth-card-body{padding:24px 32px 28px;}

    .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
    label{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;}
    .input{width:100%;padding:11px 14px;border-radius:8px;background:var(--bg-raised);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;}
    .input::placeholder{color:var(--text-3);}
    .input:focus{border-color:rgba(229,25,14,.5);box-shadow:0 0 0 3px var(--red-dim);}
    .input-wrap{position:relative;}
    .input-wrap .toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);display:flex;transition:color .15s;}
    .input-wrap .toggle-pw:hover{color:var(--text-2);}
    .input-wrap .input{padding-right:40px;}

    /* Strength bar */
    .strength-bar{display:flex;gap:4px;margin-top:8px;}
    .strength-seg{flex:1;height:2px;border-radius:2px;background:var(--border);transition:background .3s;}
    .strength-seg.weak{background:#ef4444;}
    .strength-seg.fair{background:#f97316;}
    .strength-seg.good{background:#22c55e;}

    .field-error{font-size:11px;color:#f87171;display:none;align-items:center;gap:4px;margin-top:4px;}
    .field-error.show{display:flex;}
    .field-error .material-symbols-outlined{font-size:13px;}

    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-3);font-size:11px;font-family:var(--mono);letter-spacing:.06em;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

    .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:8px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
    .btn-primary{background:var(--red);color:#fff;}
    .btn-primary:hover{background:#c9140a;}
    .btn-primary:active{transform:scale(.98);}
    .btn-google{background:var(--bg-raised);color:var(--text);border:1px solid var(--border);}
    .btn-google:hover{background:#252525;border-color:var(--border-hi);}

    .auth-footer{padding:0 32px 28px;text-align:center;font-size:13px;color:var(--text-2);}
    .auth-link{color:var(--red);font-weight:600;}
    .auth-link:hover{text-decoration:underline;}

    .alert{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;display:none;margin-bottom:16px;}
    .alert-error{background:rgba(229,25,14,.1);border:1px solid rgba(229,25,14,.25);color:#f87171;}

    .version{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.08em;}
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-card-header">
    <div class="logo"><div class="icon"></div>YDM</div>
    <h1 class="auth-title">Create account.</h1>
    <p class="auth-sub">Start saving what matters.</p>
  </div>
  <div class="auth-card-body">
    <div class="alert alert-error" id="error-msg"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" class="input" placeholder="you@example.com" autocomplete="email" required/>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" class="input" placeholder="Create a strong password" required/>
          <button type="button" class="toggle-pw" id="toggle-pw">
            <span class="material-symbols-outlined" style="font-size:18px;">visibility_off</span>
          </button>
        </div>
        <div class="strength-bar">
          <div class="strength-seg" id="s1"></div>
          <div class="strength-seg" id="s2"></div>
          <div class="strength-seg" id="s3"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm_password" type="password" class="input" placeholder="Repeat password" required/>
        <div class="field-error" id="pw-match-err">
          <span class="material-symbols-outlined">error</span>
          Passwords do not match
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn" style="margin-top:4px;">
        Create account
        <span class="material-symbols-outlined" style="font-size:18px;">arrow_forward</span>
      </button>
    </form>

    <div class="divider">or</div>

    <button type="button" class="btn btn-google" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign up with Google
    </button>
  </div>
  <div class="auth-footer">
    Already have an account? <a href="{% url 'login' %}" class="auth-link">Sign in</a>
  </div>
</div>

<div class="version">System v.2.4 // Build 9021</div>

<script src="{% static 'js/register.js' %}"></script>
<script>
  // Password visibility
  const toggle = document.getElementById('toggle-pw');
  const pw = document.getElementById('password');
  toggle.addEventListener('click', () => {
    const vis = pw.type === 'text';
    pw.type = vis ? 'password' : 'text';
    toggle.querySelector('span').textContent = vis ? 'visibility_off' : 'visibility';
  });

  // Strength indicator
  pw.addEventListener('input', () => {
    const v = pw.value;
    const s1 = document.getElementById('s1'), s2 = document.getElementById('s2'), s3 = document.getElementById('s3');
    [s1,s2,s3].forEach(s => s.className = 'strength-seg');
    if(v.length >= 4) s1.classList.add('weak');
    if(v.length >= 8) { s1.classList.add('fair'); s2.classList.add('fair'); }
    if(v.length >= 12 && /[A-Z]/.test(v) && /[0-9]/.test(v)) { s1.classList.add('good'); s2.classList.add('good'); s3.classList.add('good'); }
  });

  // Password match
  document.getElementById('confirm-password').addEventListener('input', () => {
    const err = document.getElementById('pw-match-err');
    err.classList.toggle('show', document.getElementById('confirm-password').value !== pw.value);
  });

  const handleGoogleLogin = () => { window.location.href = 'http://localhost:8000/api/accounts/google/login/'; };
</script>
</body>
</html>
