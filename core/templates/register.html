{% load static %}
<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>YMD Registration Page</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS (local build) -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display min-h-screen flex items-center justify-center p-4">
    <!-- Main Container -->
    <main
        class="w-full max-w-[400px] border border-black bg-white p-8 relative shadow-brutal transition-all duration-200">
        <!-- Header Section -->
        <header class="flex flex-col items-center gap-2 mb-8">
            <h1 class="text-neutral-dark text-6xl font-black tracking-tighter leading-none select-none">YMD</h1>
            <p class="text-primary text-sm font-bold tracking-widest uppercase">Create Account</p>
        </header>
        <!-- Registration Form -->
        <form class="flex flex-col gap-5">
            <!-- Email Field -->
            <div class="flex flex-col gap-1">
                <label class="text-neutral-dark text-xs font-bold uppercase tracking-wide" for="email">Email</label>
                <input
                    class="form-input w-full h-12 px-4 bg-white border-2 border-black text-neutral-dark placeholder:text-gray-400 focus:ring-0 focus:border-black transition-shadow duration-200 brutalist-input text-base rounded-sm"
                    id="email" name="email" placeholder="ENTER YOUR EMAIL" type="email" />
            </div>
            <!-- Password Field -->
            <div class="flex flex-col gap-1">
                <label class="text-neutral-dark text-xs font-bold uppercase tracking-wide"
                    for="password">Password</label>
                <div class="relative group">
                    <input
                        class="form-input w-full h-12 px-4 bg-white border-2 border-black text-neutral-dark placeholder:text-gray-400 focus:ring-0 focus:border-black transition-shadow duration-200 brutalist-input text-base rounded-sm pr-10"
                        id="password" name="password" placeholder="CREATE PASSWORD" type="password" />
                    <button
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-dark hover:text-primary transition-colors"
                        id="togglePassword" type="button">
                        <span class="material-symbols-outlined text-xl">visibility_off</span>
                    </button>
                </div>
                <!-- Password Strength Indicator -->
                <div class="flex gap-1 mt-2 h-1 w-full">
                    <!-- Weak (Red) -->
                    <div id="strength-1" class="h-full flex-1 bg-primary transition-opacity duration-200"
                        style="opacity: 0.2"></div>
                    <!-- Fair (Orange) -->
                    <div id="strength-2" class="h-full flex-1 bg-orange-400 transition-opacity duration-200"
                        style="opacity: 0.2"></div>
                    <!-- Good (Yellow) -->
                    <div id="strength-3" class="h-full flex-1 bg-yellow-400 transition-opacity duration-200"
                        style="opacity: 0.2"></div>
                </div>
                <p class="text-primary text-[10px] font-bold mt-1 uppercase hidden">Password is too weak</p>
            </div>
            <!-- Confirm Password Field -->
            <div class="flex flex-col gap-1">
                <label class="text-neutral-dark text-xs font-bold uppercase tracking-wide"
                    for="confirm-password">Confirm Password</label>
                <input
                    class="form-input w-full h-12 px-4 bg-white border-2 border-black text-neutral-dark placeholder:text-gray-400 focus:ring-0 focus:border-black transition-shadow duration-200 text-base rounded-sm"
                    id="confirm-password" name="confirm_password" placeholder="REPEAT PASSWORD" type="password" />
                <!-- Error State Example -->
                <p id="password-match-error"
                    class="text-primary text-[10px] font-bold mt-0.5 uppercase flex items-center gap-1 hidden">
                    <span class="material-symbols-outlined text-[12px]">error</span>
                    Passwords do not match
                </p>
            </div>
            <!-- Submit Button -->
            <button
                class="w-full h-12 bg-neutral-dark text-white text-sm font-bold uppercase tracking-wider hover:bg-primary transition-colors duration-200 mt-2 flex items-center justify-center gap-2 group border-2 border-transparent hover:border-black hover:text-black rounded-sm"
                type="submit">
                Create Account
                <span
                    class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
            </button>
        </form>
        <!-- Divider -->
        <div class="flex items-center justify-center my-6 opacity-50 select-none">
            <span class="text-[10px] text-neutral-dark font-mono tracking-widest">─────── OR ───────</span>
        </div>
        <!-- Social Login -->
        <button
            class="w-full h-12 bg-white text-neutral-dark border border-black text-sm font-bold uppercase tracking-wide hover:bg-gray-50 transition-all duration-200 flex items-center justify-center gap-3 rounded-sm hover:shadow-brutal-sm active:translate-y-[2px] active:shadow-none"
            type="button" onclick="handleGoogleLogin()">
            <svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M23.766 12.2764C23.766 11.4607 23.6999 10.6406 23.5588 9.83807H12.24V14.4591H18.7217C18.4528 15.9494 17.5885 17.2678 16.323 18.1056V21.1039H20.19C22.4608 19.0139 23.766 15.9274 23.766 12.2764Z"
                    fill="#4285F4"></path>
                <path
                    d="M12.2401 24.0008C15.4766 24.0008 18.2059 22.9382 20.1945 21.1039L16.3275 18.1055C15.2517 18.8375 13.8627 19.252 12.2445 19.252C9.11388 19.252 6.45946 17.1399 5.50705 14.2874H1.46395V17.4195C3.42297 21.3114 7.51262 24.0008 12.2401 24.0008Z"
                    fill="#34A853"></path>
                <path
                    d="M5.50253 14.2874C5.00236 12.8099 5.00236 11.1961 5.50253 9.71861V6.58643H1.46395C-0.198547 9.89423 -0.198547 14.1108 1.46395 17.4186L5.50253 14.2874Z"
                    fill="#FBBC05"></path>
                <path
                    d="M12.2401 4.74966C13.9509 4.7232 15.6044 5.36697 16.8434 6.54867L20.2695 3.12262C18.1001 1.0855 15.2208 -0.034466 12.2401 0.000808666C7.51262 0.000808666 3.42297 2.69017 1.46395 6.58643L5.50253 9.71862C6.45064 6.86154 9.10947 4.74966 12.2401 4.74966Z"
                    fill="#EA4335"></path>
            </svg>
            Sign up with Google
        </button>
        <!-- Footer Link -->
        <div class="mt-8 text-center">
            <p class="text-sm text-neutral-dark font-medium">
                Already have an account?
                <a class="font-bold underline decoration-2 decoration-primary underline-offset-4 hover:bg-black hover:text-white px-1 transition-colors"
                    href="{% url 'login' %}">Sign In</a>
            </p>
        </div>
    </main>
    <!-- Background Design Element (Subtle grid to enhance technical/media feel) -->
    <div class="fixed inset-0 pointer-events-none -z-10 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:20px_20px] opacity-40"
        data-alt="Subtle dot grid background pattern"></div>
    <script>
        const handleGoogleLogin = () => {
            // Redirect user to Django backend Google login
            const API_BASE_URL = "http://localhost:8000";
            window.location.href = `${API_BASE_URL}/api/accounts/google/login/`;
        };
    </script>
    <script src="{% static 'js/register.js' %}"></script>
</body>

</html>
