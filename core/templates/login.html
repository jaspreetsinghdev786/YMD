{% load static %}
<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>YMD Login Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center p-4 overflow-y-auto relative selection:bg-primary selection:text-white">
    <!-- Abstract Grid Background -->
    <div class="fixed inset-0 z-0 pointer-events-none opacity-[0.03] dark:opacity-[0.05]"
        style="background-image: linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px); background-size: 40px 40px;">
    </div>
    <!-- Main Container -->
    <main
        class="relative z-10 w-full max-w-[400px] bg-white dark:bg-[#111] border border-black dark:border-white p-10 flex flex-col gap-8 shadow-none group/card">
        <!-- Header / Logo -->
        <header class="flex flex-col items-center gap-2 pb-2">
            <div class="relative">
                <h1 class="text-7xl font-black tracking-[-0.05em] text-black dark:text-white leading-none select-none">
                    YMD</h1>
                <!-- Accent Dot -->
                <div class="absolute -right-3 top-2 w-2 h-2 bg-primary rounded-none"></div>
            </div>
            <p class="text-sm font-bold tracking-[0.3em] text-black dark:text-white uppercase opacity-60">Media
                Downloader</p>
        </header>
        <!-- Login Form -->
        <form class="flex flex-col gap-6 w-full">
            <!-- Email Input -->
            <div class="flex flex-col gap-1.5 group/input">
                <label
                    class="text-xs font-bold uppercase tracking-widest text-black dark:text-white group-focus-within/input:text-primary transition-colors"
                    for="email">Email Address</label>
                <input
                    class="w-full h-14 bg-transparent border-2 border-black dark:border-white text-black dark:text-white px-4 text-base font-medium placeholder:text-gray-400 placeholder:uppercase placeholder:text-sm focus:ring-0 focus:border-[3px] focus:border-black dark:focus:border-white focus:outline-none transition-all rounded-none"
                    id="email" name="email" placeholder="user@example.com" type="email" />
            </div>
            <!-- Password Input -->
            <div class="flex flex-col gap-1.5 group/input">
                <div class="flex justify-between items-center">
                    <label
                        class="text-xs font-bold uppercase tracking-widest text-black dark:text-white group-focus-within/input:text-primary transition-colors"
                        for="password">Password</label>
                    <a class="text-[10px] font-bold uppercase tracking-wider text-gray-500 hover:text-primary hover:underline transition-colors"
                        href="{% url 'forgot-password' %}">Forgot?</a>
                </div>
                <input
                    class="w-full h-14 bg-transparent border-2 border-black dark:border-white text-black dark:text-white px-4 text-base font-medium placeholder:text-gray-400 placeholder:uppercase placeholder:text-sm focus:ring-0 focus:border-[3px] focus:border-black dark:focus:border-white focus:outline-none transition-all rounded-none"
                    id="password" name="password" placeholder="••••••••" type="password" />
            </div>
            <!-- Primary Action -->
            <button
                class="relative w-full h-14 bg-black dark:bg-white text-white dark:text-black font-bold text-base uppercase tracking-[0.05em] border-2 border-black dark:border-white hover:bg-primary hover:border-primary hover:text-white dark:hover:bg-primary dark:hover:border-primary dark:hover:text-white transition-all duration-200 flex items-center justify-center gap-3 overflow-hidden mt-2 group/btn">
                <span class="relative z-10">Sign In</span>
                <span
                    class="material-symbols-outlined text-lg relative z-10 transition-transform group-hover/btn:translate-x-1">login</span>
            </button>
            <!-- Divider -->
            <div class="flex items-center gap-4 opacity-50">
                <div class="h-px bg-black dark:bg-white flex-1"></div>
                <span class="text-[10px] font-mono text-black dark:text-white whitespace-nowrap">OR CONTINUE WITH</span>
                <div class="h-px bg-black dark:bg-white flex-1"></div>
            </div>
            <!-- Secondary Action (Google) -->
            <button
                class="w-full h-14 bg-white dark:bg-black text-black dark:text-white font-bold text-sm uppercase tracking-wide border-2 border-black dark:border-white hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-colors duration-200 flex items-center justify-center gap-3"
                onclick="handleGoogleLogin()">
                <svg aria-hidden="true" class="w-5 h-5" data-alt="Google Logo" viewbox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4"></path>
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853"></path>
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05"></path>
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335"></path>
                </svg>
                <span>Google</span>
            </button>
        </form>
        <!-- Footer -->
        <footer class="text-center pt-2">
            <p class="text-sm font-medium text-black dark:text-white">
                NO ACCOUNT?
                <a class="inline-block ml-1 font-bold underline decoration-2 decoration-primary underline-offset-4 hover:bg-primary hover:text-white hover:no-underline px-1 transition-all uppercase"
                    href="{% url 'register' %}">Register Here</a>
            </p>
        </footer>
        <!-- Decorative Corner Elements for Brutalist feel -->
        <div class="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-primary dark:border-primary"></div>
        <div class="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-primary dark:border-primary"></div>
    </main>
    <!-- Version Tag -->
    <div class="fixed bottom-6 font-mono text-[10px] text-black/40 dark:text-white/40 tracking-widest uppercase">
        System v.2.4 // Build 9021
    </div>
    <script src="{% static 'js/auth.js' %}"></script>
</body>

</html>
